spring.application.name=donLimon

# Conexión a MySQL (la base se crea sola si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/don_limon_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
